<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우리 집 3D 룸 투어</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232b2622' d='M12 3 3 10.5V20a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-9.500z'/%3E%3C/svg%3E">
<style>
  :root { --head-w:396px; /* 왼쪽 위 정보 카드의 고정 너비 */ --ink:#2b2622; --paper:rgba(255,253,249,.92); --line:rgba(60,45,30,.14); --accent:#c8102e; --oak:#b98a55; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#dfe9f0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#view:active { cursor:grabbing; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); box-shadow:0 6px 24px rgba(40,30,20,.12); }
  #head { position:fixed; left:14px; top:14px; padding:12px 16px 12px; width:min(var(--head-w),calc(100vw - 28px)); }
  #head h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em; }
  #bHome { display:inline-flex; align-items:center; gap:5px; padding:0; min-height:0; border:0; background:none; border-radius:6px; font-size:inherit; font-weight:inherit; letter-spacing:inherit; color:inherit; } #bHome svg { flex:none; display:block; position:relative; top:-1px; }
  #head .sub { font-size:14px; opacity:.8; margin-top:2px; }
  #room { margin-top:9px; display:flex; align-items:baseline; gap:8px; white-space:nowrap; }
  #room b { font-size:25px; font-weight:800; letter-spacing:-.02em; flex:none; }
  #room span { font-size:14px; opacity:.82; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #btns { display:flex; gap:5px; margin-top:10px; flex-wrap:nowrap; } #btns button { white-space:nowrap; flex:none; }
  button { font:inherit; color:inherit; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-size:14.5px; font-weight:600; cursor:pointer; }
  button:hover { border-color:rgba(60,45,30,.35); }
  button:focus-visible, canvas:focus-visible { outline:2px solid #1f5fbf; outline-offset:2px; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #tourCtl { display:flex; gap:5px; margin-top:6px; } #tourCtl[hidden] { display:none; } #tourCtl button { white-space:nowrap; flex:none; } #tSpeed { text-align:left; }
  .card, #dock, #stick { z-index:2; }
  #bTour, #bTop { display:inline-flex; align-items:center; justify-content:flex-start; gap:7px; } #bTour svg { flex:none; display:block; width:13px; height:13px; } #bTop svg { flex:none; display:block; }
  #side { position:fixed; right:14px; top:14px; padding:10px; width:250px; }
  #map { width:228px; height:230px; display:block; border-radius:8px; cursor:pointer; background:#f4efe8; }
  #chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  #chips button { padding:6px 14px; font-size:14px; font-weight:600; }
  #photos { position:fixed; right:14px; bottom:14px; padding:10px; width:max-content; max-width:min(680px,calc(100vw - 586px)); }
  #photos h2 { margin:0 0 7px; font-size:14px; font-weight:700; opacity:.85; }
  #thumbs { display:flex; gap:6px; }   /* 한 줄로 나열, 패널이 사진 수만큼 왼쪽으로 넓어짐. 화면이 좁으면 스크롤 대신 사진 폭이 줄어듦 */
  #thumbs button { padding:0; border:0; background:none; border-radius:7px; flex:0 1 auto; min-width:0; min-height:0; cursor:zoom-in; display:block; line-height:0; overflow:hidden; }
  #thumbs img { height:84px; width:auto; max-width:100%; object-fit:cover; border-radius:7px; display:block; }
  #help { position:fixed; left:14px; bottom:14px; padding:10px 14px; font-size:14px; line-height:1.6; max-width:min(498px,calc(100vw - 28px)); }
  #help[hidden] { display:none; }
  #help .ht { display:none; } #help .ht button { margin-top:8px; }
  #dock { position:fixed; right:8px; bottom:8px; display:none; gap:6px; }
  #dock button { min-height:48px; padding:0 20px; font-size:15px; background:var(--paper); backdrop-filter:blur(10px); box-shadow:0 4px 14px rgba(40,30,20,.14); }
  #dock button.on { background:var(--ink); }
  body.swap #stick { left:auto; right:22px; } body.swap #photos { right:auto; left:14px; }
  #help kbd { background:#fff; border:1px solid var(--line); border-radius:5px; padding:0 5px; font:inherit; font-weight:700; }
  #stick { position:fixed; left:22px; bottom:22px; width:112px; height:112px; border-radius:50%; background:rgba(255,255,255,.55); border:1px solid var(--line); display:none; touch-action:none; }
  #stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  #light { position:fixed; inset:0; background:rgba(20,16,12,.95); display:none; align-items:center; justify-content:center; z-index:9; }
  #light img { max-width:calc(100vw - 168px); max-height:calc(100vh - 150px); border-radius:8px; display:block; }
  #light button { position:absolute; min-width:48px; min-height:48px; padding:0 20px; font-size:16px; font-weight:700; color:#fff; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.45); display:flex; align-items:center; justify-content:center; }
  #light button:hover, #light button:focus-visible { background:rgba(255,255,255,.3); border-color:#fff; outline:none; }
  #lClose { top:16px; right:16px; }
  #lPrev, #lNext { top:50%; transform:translateY(-50%); width:52px; height:52px; padding:0; }
  #light button svg { flex:none; display:block; }
  #lPrev { left:16px; } #lNext { right:16px; }
  #lTitle { position:absolute; left:90px; right:90px; top:16px; height:48px; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:22px; font-weight:800; letter-spacing:-.01em; pointer-events:none; }
  #lPage { position:absolute; left:0; right:0; bottom:26px; text-align:center; color:#fff; font-size:17px; font-weight:600; letter-spacing:.06em; font-variant-numeric:tabular-nums; pointer-events:none; }
  @media (max-width:720px) { #light img { max-width:calc(100vw - 20px); max-height:calc(100vh - 170px); } #lPrev, #lNext { top:auto; bottom:12px; transform:none; } }
  /* 터치 기기: 누르는 곳은 44px 이상 */
  @media (pointer:coarse) {
    #stick { display:block; } #help { bottom:150px; } #help .hk { display:none; } #help .ht { display:block; }
    button { min-height:44px; padding-left:16px; padding-right:16px; } #chips button { min-width:44px; }
    #bHome { padding:12px 10px 12px 0; margin:-12px 0; }
  }
  /* 좁은 화면·가로로 눕힌 휴대폰: 위에는 방 이름 띠, 아래에는 평면도/사진을 여닫는 버튼 */
  @media (max-width:720px), (max-height:520px) {
    #head { left:8px; top:8px; padding:8px 12px 10px; width:min(var(--head-w),calc(100vw - 16px)); }
    #head .sub { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; } #head h1 { font-size:15px; margin-bottom:4px; }
    #room { margin-top:0; } #room b { font-size:21px; } #btns { margin-top:8px; }
    #dock { display:flex; }
    #side, #photos { display:none; left:auto; right:8px; top:auto; bottom:64px; width:min(360px,calc(100vw - 136px)); max-width:none; max-height:calc(100vh - 76px); overflow-y:auto; padding:8px; }
    body.show-side #side, body.show-photos #photos { display:block; }
    #map { width:100%; max-width:230px; height:auto; aspect-ratio:384/388; margin:0 auto; }
    #thumbs img { height:64px; }
    #stick { left:8px; bottom:8px; width:104px; height:104px; }
    #help { left:8px; bottom:auto; top:214px; width:min(var(--head-w),calc(100vw - 16px)); }
    body.swap #stick { left:auto; right:8px; } body.swap #dock { right:auto; left:8px; } body.swap #side, body.swap #photos { right:auto; left:8px; }
  }
  /* 가로로 눕힌 휴대폰: 평면도와 방 버튼을 옆으로 나란히 놓아 스크롤 없이 보이게 */
  @media (max-height:520px) {
    body.show-side #side { display:flex; gap:8px; align-items:flex-start; width:min(540px,calc(100vw - 28px - min(var(--head-w),100vw - 16px))); }
    #map { width:140px; flex:none; margin:0; } #chips { margin-top:0; }
    #help { top:8px; left:calc(16px + min(var(--head-w),100vw - 16px)); width:auto; max-width:calc(100vw - 24px - min(var(--head-w),100vw - 16px)); }
  }
  @media (max-width:430px) { #btns button, #tourCtl button { padding-left:12px; padding-right:12px; } }
  @media (max-width:375px) { #btns button, #tourCtl button { padding-left:9px; padding-right:9px; } #btns, #tourCtl { gap:4px; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0" role="application" aria-label="3D 집 내부. W A S D 또는 방향키로 이동하고, 드래그로 둘러봅니다. 방 이름 버튼으로 바로 이동할 수 있습니다."></canvas>

<div id="head" class="card">
  <h1><button id="bHome" type="button" aria-label="우리 집 3D 룸 투어, 처음 상태로 돌아가기"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M10.6 3.3a2.1 2.1 0 0 1 2.8 0l6.9 6.2A2.1 2.1 0 0 1 21 11.1V19a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 19v-7.9a2.1 2.1 0 0 1 .7-1.6z"/></svg><span>우리 집 3D 룸 투어</span></button></h1>
  <div class="sub">**마을 ***** *차 37평</div>
  <div id="room" aria-live="polite" aria-atomic="true"><b id="roomName">전실</b><span id="roomNote"></span></div>
  <div id="btns">
    <button id="bTour" type="button" class="primary" aria-pressed="false"><svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true" fill="currentColor"><path d="M3 1.6v10.8a.6.6 0 0 0 .92.5l8.3-5.4a.6.6 0 0 0 0-1L3.92 1.1A.6.6 0 0 0 3 1.6z"/></svg><span>자동 투어</span></button>
    <button id="bTop" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span>위에서 보기</span></button>
    <button id="bHelp" type="button" aria-expanded="false" aria-controls="help">조작 안내</button>
  </div>
  <div id="tourCtl" role="group" aria-label="자동 투어 조절" hidden>
    <button id="tPrev" type="button">이전 방</button>
    <button id="tNext" type="button">다음 방</button>
    <button id="tSpeed" type="button">속도 1.0 배속</button>
  </div>
</div>

<div id="side" class="card">
  <canvas id="map" width="384" height="388" role="img" aria-label="평면도. 누르면 그 자리로 이동합니다. 키보드로는 아래 방 이름 버튼을 쓰세요."></canvas>
  <div id="chips" role="group" aria-label="방으로 바로 이동"></div>
</div>

<div id="photos" class="card"><h2>실제 사진 · <span id="photoRoom"></span></h2><div id="thumbs"></div></div>

<div id="help" class="card" role="region" aria-label="조작 안내" hidden>
  <div class="hk"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키로 이동 · 드래그로 둘러보기 · <kbd>Shift</kbd> 빠르게<br>바닥이나 평면도를 누르면 그 자리로 이동합니다</div>
  <div class="ht">조이스틱으로 이동 · 화면을 밀어 둘러보기<br>바닥이나 평면도를 누르면 그 자리로 이동합니다<br><button id="bSwap" type="button">조이스틱 좌우 바꾸기</button></div>
</div>
<div id="dock"><button id="dSide" type="button" aria-expanded="false" aria-controls="side">평면도</button><button id="dPhotos" type="button" aria-expanded="false" aria-controls="photos">실제 사진</button></div>
<div id="stick"><i></i></div>
<div id="light" role="dialog" aria-modal="true" aria-label="실제 사진 크게 보기">
  <div id="lTitle"></div>
  <button id="lClose" type="button">닫기</button>
  <button id="lPrev" type="button" aria-label="이전 사진"><svg viewBox="4 1 16 22" width="19" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3L7.5 12l9 9"/></svg></button>
  <img alt="">
  <button id="lNext" type="button" aria-label="다음 사진"><svg viewBox="4 1 16 22" width="19" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3l9 9-9 9"/></svg></button>
  <div id="lPage" aria-live="polite"></div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const cv = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.6));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd3e4f1);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 900);
camera.rotation.order = 'YXZ';

/* ---------- textures ---------- */
function mkTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; }
let seed=7; function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
const texWood = mkTex(1024,1024,(g,w,h)=>{ // 2m x 2m, planks along v
  const n=11, pw=w/n;
  for(let i=0;i<n;i++){ let y=-rnd()*h*0.8;
    while(y<h){ const len=h*(0.55+rnd()*0.5); const l=62+rnd()*9, s=46+rnd()*8, hu=31+rnd()*4;
      g.fillStyle=`hsl(${hu},${s}%,${l}%)`; g.fillRect(i*pw,y,pw,len);
      for(let k=0;k<26;k++){ g.strokeStyle=`rgba(120,80,35,${0.03+rnd()*0.07})`; g.lineWidth=0.6+rnd()*1.4; const x=i*pw+rnd()*pw; g.beginPath(); g.moveTo(x,y);
        g.bezierCurveTo(x+(rnd()-.5)*10,y+len*.3,x+(rnd()-.5)*10,y+len*.6,x+(rnd()-.5)*6,y+len); g.stroke(); }
      g.fillStyle='rgba(90,60,30,.35)'; g.fillRect(i*pw,y+len-1,pw,1.5); y+=len; }
    g.fillStyle='rgba(90,60,30,.3)'; g.fillRect(i*pw,0,1.2,h); }
});
function tileTex(base, cols, rows, grout, vary){ return mkTex(512,512,(g,w,h)=>{ g.fillStyle=grout; g.fillRect(0,0,w,h);
  const tw=w/cols, th=h/rows, gp=3; const c=new THREE.Color(base);
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ const k=1+(rnd()-.5)*vary; g.fillStyle=`rgb(${Math.min(255,c.r*255*k)|0},${Math.min(255,c.g*255*k)|0},${Math.min(255,c.b*255*k)|0})`;
    g.fillRect(i*tw+gp/2,j*th+gp/2,tw-gp,th-gp);
    const gr=g.createLinearGradient(i*tw,0,(i+1)*tw,0); gr.addColorStop(0,'rgba(255,255,255,.22)'); gr.addColorStop(.5,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(0,0,0,.06)');
    g.fillStyle=gr; g.fillRect(i*tw+gp/2,j*th+gp/2,tw-gp,th-gp); } }); }
const texRed   = tileTex('#a9503f', 3, 6, '#e9dfd6', .10);   // 0.6m: 20x10cm
const texMint  = tileTex('#9fd4cb', 8, 2, '#f1f6f4', .07);   // 0.52m: 6.5x26cm 세로
const texYel   = tileTex('#e9bd3f', 8, 2, '#f6efd9', .07);
const texIvory = tileTex('#e9e3d6', 8, 2, '#f7f4ee', .05);
function stoneTex(base, vein, grout){ return mkTex(512,512,(g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let k=0;k<16;k++){ g.strokeStyle=vein; g.globalAlpha=.10+rnd()*.25; g.lineWidth=.6+rnd()*2.2; g.beginPath(); let x=rnd()*w,y=rnd()*h; g.moveTo(x,y);
    for(let s=0;s<5;s++){ x+=(rnd()-.3)*150; y+=(rnd()-.5)*110; g.lineTo(x,y);} g.stroke(); }
  g.globalAlpha=1; g.strokeStyle=grout||'rgba(120,120,115,.5)'; g.lineWidth=2; g.strokeRect(0,0,w,h); }); }
const texMarble = stoneTex('#dcdcd8','#8d8f8e');
const texBeige  = stoneTex('#f3ecdf','#e4d9c5','rgba(250,245,232,.95)');
const texTop    = stoneTex('#e6dfd2','#b9a98d');
const texBlind  = mkTex(8,64,(g,w,h)=>{ g.clearRect(0,0,w,h); g.fillStyle='rgba(255,255,255,.93)'; g.fillRect(0,0,w,h*.74); g.fillStyle='rgba(215,222,228,.5)'; g.fillRect(0,h*.74,w,h*.26); });
const texDoors  = mkTex(256,64,(g,w,h)=>{ g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.fillStyle='rgba(120,120,120,.55)'; g.fillRect(0,0,2.5,h); });
const texSmeg   = mkTex(256,64,(g,w,h)=>{ g.clearRect(0,0,w,h); g.fillStyle='#e9e9e9'; g.font='700 44px Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('S M E G',w/2,h/2); });

/* ---------- materials ---------- */
const P=(o)=>{ const m=new THREE.MeshPhongMaterial(Object.assign({shininess:8,specular:0x111111},o)); m.color.convertSRGBToLinear(); m._p=1; return m; };
const M={
  wall:P({color:0xf1eee7}), ceil:P({color:0xfafaf7,emissive:0x4a4946}), base:P({color:0xfdfcfa}),
  wood:P({map:texWood,shininess:28,specular:0x2a2218}), oak:P({color:0xc79a66,shininess:20}), birch:P({color:0xe2c79b,shininess:20}),
  red:P({map:texRed,shininess:18}), mint:P({map:texMint,shininess:70,specular:0x556666}), yel:P({map:texYel,shininess:70,specular:0x665533}),
  ivory:P({map:texIvory,shininess:70,specular:0x555555}), marble:P({map:texMarble,shininess:50,specular:0x444444}), beige:P({map:texBeige,shininess:30,emissive:0x1d1a14}),
  top:P({map:texTop,shininess:60,specular:0x444444}), white:P({color:0xffffff,shininess:30}), gloss:P({color:0xffffff,shininess:110,specular:0x777777}),
  cab:P({color:0xeeeae1,shininess:22}), leather:P({color:0xb5692f,shininess:18,specular:0x1c1208}), leather2:P({color:0xc27637,shininess:18,specular:0x1c1208}),
  fridge:P({color:0xd3122a,shininess:120,specular:0x3a3a3a}), chrome:P({color:0xc9ccd0,shininess:150,specular:0xffffff}),
  black:P({color:0x1c1c1e,shininess:40}), dark:P({color:0x3a3a3c}), gray:P({color:0xb9bbbd}), sheet:P({color:0xfbf9f5}), ivoryS:P({color:0xf1ead9,shininess:30}),
  yellow:P({color:0xe7c35a}), curtain:P({color:0xc9a83f}), reddoor:P({color:0xc8102e,shininess:40,specular:0x101010}), yeldoor:P({color:0xe9c23c,shininess:40}),
  glass:new THREE.MeshPhongMaterial({color:0xdcebf2,transparent:true,opacity:.16,shininess:120,specular:0xffffff,depthWrite:false}),
  frost:new THREE.MeshPhongMaterial({color:0xf3f7f8,transparent:true,opacity:.72,depthWrite:false,side:THREE.DoubleSide}),

  tour.t+=dt/dur; const t=Math.min(1,tour.t), e=t*t*(3-2*t); pl.x=a[0]+(b[0]-a[0])*e; pl.z=a[1]+(b[1]-a[1])*e;
  const lx=a[2]+(b[2]-a[2])*e, lz=a[3]+(b[3]-a[3])*e; const want=Math.atan2(-(lx-pl.x),-(lz-pl.z)); pl.yaw=angLerp(pl.yaw,want,Math.min(1,dt*2.6)); pl.pitch+=(-0.04-pl.pitch)*Math.min(1,dt*2);
  if(tour.t>=1){ tour.i++; tour.t=0; } }

/* ---------- 위에서 보기 ---------- */
const bTop=document.getElementById('bTop');
const ICO_BOX='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>', ICO_EYE='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"/><path d="M7 21l3-4.5"/><path d="M16 21l-2-4.5-3-3 1-5.5"/><path d="M6 12l2-3 4-1 3 3 3 1"/></svg>';   // 위에서 보기: 입체 상자 / 걸어서 보기: 걷는 사람
function setTop(v){ top=v; document.body.classList.toggle('top',v); ceilG.visible=!v; bTop.classList.toggle('on',v); bTop.innerHTML=v?ICO_EYE+'<span>걸어서 보기</span>':ICO_BOX+'<span>위에서 보기</span>'; bTop.setAttribute('aria-pressed',v?'true':'false'); if(v) stopTour(); }
bTop.onclick=()=>setTop(!top);
const me=new THREE.Mesh(new THREE.ConeGeometry(0.27,0.9,28),new THREE.MeshPhongMaterial({color:new THREE.Color(0xc8102e).convertSRGBToLinear(),shininess:30}))   /* 뒤집은 원뿔: 뾰족한 끝이 현재 위치를 가리킴 */; me.rotation.order='YXZ'; me.visible=false; scene.add(me);

/* ---------- 평면도 ---------- */
const map=document.getElementById('map'), mg=map.getContext('2d'); const MS=map.width/12.6, MO=0.28;
const mcol={'전실':'#e7c3b8','세탁실':'#e7c3b8','안방 발코니':'#e7c3b8','공용 욕실':'#f1dc9a','안방 욕실':'#bfe3dc'};
function drawMap(){ mg.clearRect(0,0,map.width,map.height); const cur=zoneAt(pl.x,pl.z);
  Z.forEach(z=>{ mg.fillStyle=(cur&&cur[0]===z[0])?'#e9c79c':(mcol[z[0]]||'#f0dfc6'); mg.fillRect((z[1]+MO)*MS,(z[3]+MO)*MS,(z[2]-z[1])*MS+.5,(z[4]-z[3])*MS+.5); });
  mg.fillStyle='#5b5148'; solids.forEach(s=>{ if((s[1]-s[0])<0.25||(s[3]-s[2])<0.25) mg.fillRect((s[0]+MO)*MS,(s[2]+MO)*MS,Math.max(2,(s[1]-s[0])*MS),Math.max(2,(s[3]-s[2])*MS)); });
  mg.fillStyle='rgba(91,81,72,.28)'; solids.forEach(s=>{ if((s[1]-s[0])>=0.25&&(s[3]-s[2])>=0.25) mg.fillRect((s[0]+MO)*MS,(s[2]+MO)*MS,(s[1]-s[0])*MS,(s[3]-s[2])*MS); });
  mg.fillStyle='#5b5148'; wallish.forEach(s=>mg.fillRect((s[0]+MO)*MS,(s[2]+MO)*MS,(s[1]-s[0])*MS,(s[3]-s[2])*MS));
  const px=(pl.x+MO)*MS, pz=(pl.z+MO)*MS; mg.save(); mg.translate(px,pz); mg.rotate(-pl.yaw); mg.fillStyle='rgba(200,16,46,.22)'; mg.beginPath(); mg.moveTo(0,0); mg.arc(0,0,58,-Math.PI/2-0.6,-Math.PI/2+0.6); mg.fill();
  mg.fillStyle='#c8102e'; mg.beginPath(); mg.arc(0,0,8,0,6.3); mg.fill(); mg.strokeStyle='#fff'; mg.lineWidth=3; mg.stroke(); mg.restore(); }
map.addEventListener('click',e=>{ const r=map.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*map.width/MS-MO, z=(e.clientY-r.top)/r.height*map.height/MS-MO;
  if(blocked(x,z)) { const q=zoneAt(x,z); if(q) go(q[0]); return; } stopTour(); const ox=pl.x, oz=pl.z; pl.x=x; pl.z=z; if(Math.hypot(x-ox,z-oz)>0.3) pl.yaw=Math.atan2(-(x-ox),-(z-oz)); });
// 좁은 화면: 평면도/실제 사진 패널 여닫기, 조작 안내, 조이스틱 좌우
const mqSmall=window.matchMedia('(max-width:720px), (max-height:520px)'), calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const dSide=document.getElementById('dSide'), dPhotos=document.getElementById('dPhotos'), helpEl=document.getElementById('help'), bHelp=document.getElementById('bHelp');
function syncDock(){ const c=document.body.classList; [[dSide,'show-side'],[dPhotos,'show-photos']].forEach(q=>{ const on=c.contains(q[1]); q[0].classList.toggle('on',on); q[0].setAttribute('aria-expanded',on?'true':'false'); }); }
function closePanels(){ document.body.classList.remove('show-side','show-photos'); syncDock(); }
function togglePanel(k){ const c=document.body.classList, on=!c.contains(k); c.remove('show-side','show-photos'); if(on) c.add(k); syncDock(); }
dSide.onclick=()=>togglePanel('show-side'); dPhotos.onclick=()=>togglePanel('show-photos');
function setHelp(v){ helpEl.hidden=!v; bHelp.setAttribute('aria-expanded',v?'true':'false'); }
bHelp.onclick=()=>setHelp(helpEl.hidden); setHelp(!mqSmall.matches && window.matchMedia('(pointer:fine)').matches);
function setSwap(v){ document.body.classList.toggle('swap',v); try{ localStorage.setItem('tour-swap',v?'1':''); }catch(e){} }
document.getElementById('bSwap').onclick=()=>setSwap(!document.body.classList.contains('swap'));
try{ if(localStorage.getItem('tour-swap')==='1') setSwap(true); }catch(e){}
const chips=document.getElementById('chips'); Object.keys(VIEW).forEach(n=>{ const b=document.createElement('button'); b.type='button'; b.textContent=n; b.onclick=()=>{ go(n); if(mqSmall.matches) closePanels(); }; chips.appendChild(b); });

/* ---------- 실제 사진 ---------- */
const thumbs=document.getElementById('thumbs'), light=document.getElementById('light'); let shown='';
function showRoom(name){ if(name===shown) return; shown=name; document.getElementById('roomName').textContent=name; document.getElementById('roomNote').textContent=NOTE[name]||''; document.getElementById('photoRoom').textContent=name;
  thumbs.innerHTML=''; (PHOTOS[name]||[]).forEach((id,k)=>{ const bt=document.createElement('button'), im=document.createElement('img'); bt.type='button'; bt.setAttribute('aria-label',name+' 실제 사진 '+(k+1)+' 크게 보기'); im.src='photos/'+id+'.jpg'; im.alt=''; bt.appendChild(im); bt.onclick=()=>lOpen(PHOTOS[name],k,name,bt); thumbs.appendChild(bt); });
  [...chips.children].forEach(b=>{ const on=b.textContent===name; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); }); }
// 사진 크게 보기: 닫기 버튼, 좌우 넘김, 쪽 표시
const lImg=light.querySelector('img'), lPage=document.getElementById('lPage'), lPrev=document.getElementById('lPrev'), lNext=document.getElementById('lNext'), lClose=document.getElementById('lClose');
let lList=[], lIdx=0, lName='', lFrom=null;
function lShow(i){ lIdx=(i+lList.length)%lList.length; lImg.src='photos/'+lList[lIdx]+'.jpg'; lImg.alt=lName+' 실제 사진 '+(lIdx+1); document.getElementById('lTitle').textContent=lName; lPage.textContent=(lIdx+1)+' / '+lList.length; lPrev.style.display=lNext.style.display=lList.length>1?'':'none'; }
function lOpen(list,i,name,from){ lList=list; lName=name; lFrom=from||null; stopTour(); for(const k in keys) keys[k]=false; light.style.display='flex'; lShow(i); lClose.focus(); }
function lHide(){ light.style.display='none'; if(lFrom&&lFrom.isConnected) lFrom.focus(); else cv.focus(); lFrom=null; }
const lIsOpen=()=>light.style.display==='flex';
lClose.onclick=lHide; lPrev.onclick=()=>lShow(lIdx-1); lNext.onclick=()=>lShow(lIdx+1);
light.onclick=e=>{ if(e.target===light) lHide(); };
window.addEventListener('keydown',e=>{ if(!lIsOpen()) return; if(e.code==='Escape') lHide(); else if(e.code==='ArrowLeft') lShow(lIdx-1); else if(e.code==='ArrowRight') lShow(lIdx+1); else if(e.code==='Tab'){ const f=[lClose,lPrev,lNext].filter(b=>b.style.display!=='none'), k=f.indexOf(document.activeElement); f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus(); } else if(e.code==='Enter'||e.code==='Space') return; e.preventDefault(); e.stopImmediatePropagation(); },true);
{ let sx=null; light.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true}); light.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50&&lList.length>1) lShow(lIdx+(dx<0?1:-1)); },{passive:true}); }

/* ---------- loop ---------- */
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
(function mirrorEnv(){ try{ const rt=new THREE.WebGLCubeRenderTarget(512,{encoding:THREE.sRGBEncoding,generateMipmaps:false}); const cc=new THREE.CubeCamera(0.05,60,rt); cc.position.set(2.2,1.5,6.03); scene.add(cc);
  dressMirror.visible=false; cc.update(renderer,scene); dressMirror.visible=true; dressMirror.material=new THREE.MeshBasicMaterial({color:0xf2f6f7,envMap:rt.texture,reflectivity:1}); }catch(e){} })();
// 홈: 제목(아이콘 포함)을 누르면 처음 상태로 되돌림
document.getElementById('bHome').onclick=()=>{ stopTour(); tourSaved=null; tourSpeed=1; tSpeed.textContent=spLabel(1); glide=null; setTop(false); orbit.th=0.5; orbit.ph=0.95; orbit.d=19;
  camera.fov=72; camera.updateProjectionMatrix(); pl.x=9.9; pl.z=2.3; lookAt(8.0,2.3); pl.pitch=-0.04; closePanels(); setHelp(!mqSmall.matches&&window.matchMedia('(pointer:fine)').matches); if(lIsOpen()) lHide(); syncTourCtl(); };
// 글자가 바뀌는 버튼은 가장 긴 글자 기준으로 너비를 고정
function fixWidths(){ const sp=spLabel;
  [[bTour,[ICO_PLAY+'<span>자동 투어</span>',ICO_PAUSE+'<span>투어 멈춤</span>',ICO_PLAY+'<span>이어서 투어</span>']],[bTop,[ICO_BOX+'<span>위에서 보기</span>',ICO_EYE+'<span>걸어서 보기</span>']],[tSpeed,SPEEDS.map(sp)]].forEach(q=>{
    const b=q[0], keep=b.innerHTML, wasHidden=tourCtl.hidden; tourCtl.hidden=false; b.style.width=''; let w=0; q[1].forEach(h=>{ b.innerHTML=h; w=Math.max(w,b.getBoundingClientRect().width); }); b.innerHTML=keep; tourCtl.hidden=wasHidden; b.style.width=Math.ceil(w)+'px'; }); }
fixWidths(); window.addEventListener('resize',fixWidths); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fixWidths);
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(tour) tourStep(dt*tourSpeed);
  else if(glide){ glide.t+=dt/(calm?0.001:0.5); const t=Math.min(1,glide.t), e=t*t*(3-2*t); pl.x=glide.x0+(glide.x1-glide.x0)*e; pl.z=glide.z0+(glide.z1-glide.z0)*e; if(t>=1) glide=null; }
  else if(!top){ let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y, s=(keys.KeyD?1:0)-(keys.KeyA?1:0); const turn=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+joy.x*0.9; pl.yaw-=turn*dt*1.7;
    const sp=(keys.ShiftLeft||keys.ShiftRight?3.2:1.7)*dt; const sn=Math.sin(pl.yaw), cs=Math.cos(pl.yaw); const dx=(-sn*f+cs*s)*sp, dz=(-cs*f-sn*s)*sp;
    if(dx&&!blocked(pl.x+dx,pl.z)) pl.x+=dx; if(dz&&!blocked(pl.x,pl.z+dz)) pl.z+=dz; }
  const q=zoneAt(pl.x,pl.z); if(q){ pl.y+=((q[8]+EYE)-pl.y)*Math.min(1,dt*8); showRoom(q[0]); }
  if(!calm){ mobile.rotation.y+=dt*0.22; mobile.userData.parts[0].rotation.y-=dt*0.37; mobile.userData.parts[1].rotation.y+=dt*0.5; }   // 움직임 줄이기 설정이면 모빌을 돌리지 않음
  { const tgOpen=Math.hypot(pl.x-4.85,pl.z-1.1)<0.95; sliders.forEach(d=>{ const tg=tgOpen?d.o:d.c; d.g.position.z+=(tg-d.g.position.z)*(calm?1:Math.min(1,dt*4)); }); }
  doorsAnim.forEach(d=>{ const tg=Math.hypot(pl.x-d.cx,pl.z-d.cz)<1.5?d.o:d.c; d.g.rotation.y+=(tg-d.g.rotation.y)*(calm?1:Math.min(1,dt*5)); });
  { const near=Math.hypot(pl.x-9.38,pl.z-5.69)<1.2; const tg=near?1.62:0; bathDoor.rotation.y+=(tg-bathDoor.rotation.y)*(calm?1:Math.min(1,dt*5)); }   // 다가가면 열리는 공용 욕실 문
  if(top){ const cx=6,cz=6.2; camera.position.set(cx+orbit.d*Math.sin(orbit.ph)*Math.sin(orbit.th),orbit.d*Math.cos(orbit.ph),cz+orbit.d*Math.sin(orbit.ph)*Math.cos(orbit.th)); camera.lookAt(cx,0.5,cz);
    me.visible=true; me.position.set(pl.x,3.4+(calm?0:Math.abs(Math.sin(now*0.0052))*0.5),pl.z); me.rotation.set(Math.PI,0,0); /* 콩콩 뛰는 움직임 */ }
  else { me.visible=false; camera.position.set(pl.x,pl.y,pl.z); camera.rotation.set(pl.pitch,pl.yaw,0); }
  if(ringT>0){ ringT-=dt*1.8; ring.visible=ringT>0; ring.material.opacity=Math.max(0,ringT)*0.85; const k=1.5-0.5*Math.max(0,ringT); ring.scale.set(k,k,k); }
  renderer.render(scene,camera); drawMap(); requestAnimationFrame(frame); }
lookAt(8.0,2.3); showRoom('전실'); requestAnimationFrame(frame);
window.__tour={pl,go,setTop,orbit,lookAt,TOUR,blocked,solids,doorsAnim};
})();
</script>
